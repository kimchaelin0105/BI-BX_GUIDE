<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" sizes="36x36" href="images/favicon.png">

    <title>BI / BX GUIDE</title>

    <!-- CSS 연결 -->
    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/pageon-cursor.css">
</head>

<body>

    <div id="wrap">

        <!-- BI/BX 가이드 시작 -->
        <div class="guide">

            <img src="./images/cover.png" alt="cover">
            <img src="./images/background.png" alt="background">
            <img src="./images/persona.png" alt="Persona">
            <img src="./images/KEYWORD.png" alt="KEYWORD">
            <img src="./images/logo_guide.png" alt="logo_guide">
            <img src="./images/COMPERTITORANALYSIS.png" alt="CompetitorAnalysis">
            <img src="./images/SWOT.png" alt="SWOT">
            <img src="./images/healing.png" alt="healing">

        </div>
        <!-- BI/BX 가이드 끝 -->
        <div class="top">
            <a href="#" id="topBtn">
                <img src="./images/top.png" alt="top">
            </a>
        </div>

        <!-- BACK 버튼 -->
        <div class="back">
            <a href="https://kimchaelin0105.github.io/BI-BX_GUIDE/">
                <img src="./images/back.png" alt="back">
            </a>
        </div>
    </div>


    <script type="text/javascript" src="http://ajax.googleapis.com/ajax/libs/jquery/1.4.3/jquery.min.js"></script>
    <script src="js/jquery-1.12.3.js"></script>
    <script src="js/sub_script.js"></script>

    <script src="js/mouse-follower.js" defer></script>

    <script>
        document.getElementById("topBtn").addEventListener("click", function (e) {
            e.preventDefault();

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        });
    </script>

</body>


</html>
